spring:
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    test-connection: true
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    sender:
      name: ${SENDER_NAME}

  kafka:
    bootstrap-servers: localhost:9092
    listener:
      ack-mode: record
    consumer:
      group-id: mail-sender-consumer-group
      auto-offset-reset: earliest