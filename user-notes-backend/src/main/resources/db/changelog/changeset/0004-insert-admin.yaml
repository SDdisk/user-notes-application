databaseChangeLog:
  - changeSet:
      id: insert-admin-user
      author: SDdisk
      changes:
        - insert:
            tableName: user_table
            columns:
              - column:
                  name: user_id
                  value: ${ADMIN_USER_ID}
              - column:
                  name: username
                  value: ${ADMIN_USERNAME}
              - column:
                  name: email
                  value: ${ADMIN_EMAIl}
              - column:
                  name: password
                  value: ${ADMIN_PASSWORD}
              - column:
                  name: role
                  value: "ADMIN"
              - column:
                  name: create_date
                  valueComputed: CURRENT_TIMESTAMP
              - column:
                  name: update_date
                  valueComputed: CURRENT_TIMESTAMP